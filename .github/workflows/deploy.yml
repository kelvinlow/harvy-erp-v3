name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - staging
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies (Root)
        run: yarn install

      - name: Install dependencies (Worker)
        run: cd worker && yarn install

      - name: Set Deployment Variables
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "WRANGLER_ENV=production" >> $GITHUB_ENV
            echo "API_URL=https://havys-erp-worker-production.lowshinsheng.workers.dev/api/v1" >> $GITHUB_ENV
            echo "PAGES_BRANCH=main" >> $GITHUB_ENV
            echo "DEPLOY_TYPE=Production" >> $GITHUB_ENV
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "WRANGLER_ENV=development" >> $GITHUB_ENV
            echo "API_URL=https://havys-erp-worker.lowshinsheng.workers.dev/api/v1" >> $GITHUB_ENV
            echo "PAGES_BRANCH=staging" >> $GITHUB_ENV
            echo "DEPLOY_TYPE=Staging" >> $GITHUB_ENV
          else
            echo "WRANGLER_ENV=development" >> $GITHUB_ENV
            echo "API_URL=https://havys-erp-worker.lowshinsheng.workers.dev/api/v1" >> $GITHUB_ENV
            echo "PAGES_BRANCH=develop" >> $GITHUB_ENV
            echo "DEPLOY_TYPE=Preview" >> $GITHUB_ENV
          fi

      - name: Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          npx wrangler d1 migrations apply havys-erp-db --remote -y

      - name: Database Seeding
        # Only seed on develop/preview to avoid accidental production data overwrite if unwanted
        # Or you can remove the 'if' to seed on every deploy if that's the intention
        if: github.ref_name == 'develop'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          npx wrangler d1 execute havys-erp-db --remote --file=seed_production.sql -y

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler deploy --env production
          else
            npx wrangler deploy
          fi

      - name: Create .env for build
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ env.API_URL }}" > .env.production

      - name: Build Frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.API_URL }}
        run: |
          # Build the Next.js application first
          yarn build
          # Use next-on-pages to generate the Cloudflare Pages compatible output
          npx @cloudflare/next-on-pages

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .vercel/output/static --project-name havys-erp-pages --branch ${{ env.PAGES_BRANCH }}
