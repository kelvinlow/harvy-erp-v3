name = "havys-erp-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "havys-erp-db"
database_id = "a2805b91-3139-4d25-b5a1-3b47a565aab3"

# R2 Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "havys-erp-bucket"

# Environment variables
[vars]
ENVIRONMENT = "development"
JWT_SECRET = "your-secret-key-change-this-in-production-use-a-long-random-string"

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Production environment overrides
[env.production]
vars = { ENVIRONMENT = "production", JWT_SECRET = "K3LV1N2_sXQMP8ZL0V3#TH14NH39A7FR" }

# D1 Database Binding for Production
[[env.production.d1_databases]]
binding = "DB"
database_name = "havys-erp-db"
database_id = "a2805b91-3139-4d25-b5a1-3b47a565aab3"

# R2 Bucket Binding for Production
[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "havys-erp-bucket"
